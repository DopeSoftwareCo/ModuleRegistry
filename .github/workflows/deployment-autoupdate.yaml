name: Auto Merge Dev to Deployment

on:
  schedule:
    - cron: "0 9 * * 3" # Every Wednesday at 4:00 am ET
    - cron: "0 9 * * 6" # Every Saturday at 4:00 am ET
  workflow_dispatch: # Allow manual triggering as well

jobs:
  merge:
    environment: staging
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all branches to ensure 'deployment' exists

      # Create Pull Request from dev to deployment
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v4
        with:
          branch: deployment
          title: "Automated Merge from Dev to Deployment"
          body: "Scheduled merge from dev branch."
          commit-message: "Merge dev branch into deployment"
          base: deployment
          head: dev

      # Auto-approve the pull request
      - name: Approve Pull Request
        uses: hmarr/auto-approve-action@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Merge the pull request
      - name: Merge Pull Request
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pullRequest = context.payload.pull_requests[0];
            if (pullRequest) {
              await github.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequest.number,
              });
            }
