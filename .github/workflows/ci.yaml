name: CI Tests

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install dependencies -- BE
      run: npm ci
      working-directory: ./BE

    - name: Install dependencies -- FE
      run: npm ci
      working-directory: ./FE

    - name: Run Jest tests
      run: npm test
      working-directory: ./BE
